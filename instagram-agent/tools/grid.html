<!doctype html><html><head><meta charset="utf-8"><title>grid</title>
<style>html,body{margin:0;padding:0;background:#000}#g{display:flex;flex-wrap:wrap}img{display:block}</style></head>
<body><div id="g"></div><script>
// Tiles several images (e.g. video frames) at a fixed width so one screenshot captures them all.
// Hash: <width>|<url1>|<url2>|...
const parts = decodeURIComponent(location.hash.slice(1)).split('|');
const w = parseInt(parts.shift(), 10);
document.getElementById('g').style.width = (w * 2) + 'px';
for (const u of parts) { const i = new Image(); i.src = u; i.width = w; document.getElementById('g').appendChild(i); }
</script></body></html>
